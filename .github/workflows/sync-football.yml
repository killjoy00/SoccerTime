name: Sync Premier League data
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync API-Football
        env:
          SOCCER_API_KEY: ${{ secrets.SOCCER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: node scripts/sync-football.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "soccertime-bot"
          git config user.email "soccertime-bot@users.noreply.github.com"
          git add public/data/epl.json
          git diff --cached --quiet || git commit -m "data: refresh Premier League feed"
          git push