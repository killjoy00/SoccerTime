name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check scripts/sync-football.mjs
      - run: node --check scripts/mobile-smoke.mjs
      - run: SOCCERTIME_SMOKE_SELF_TEST=1 node scripts/mobile-smoke.mjs
      - run: npm run build
