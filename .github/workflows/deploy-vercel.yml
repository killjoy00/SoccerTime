name: Deploy Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-time-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ayjs9f3ahL8cNptN9huz7G12
      VERCEL_PROJECT_ID: prj_kaof4nw5rxqolfH9FQAN7dRDVXoa
      VERCEL_CLI_VERSION: 59.16.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Vercel deployment credential
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is missing. Production deployment cannot run."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh official FPL data
        run: node scripts/sync-football.mjs

      - name: Pull production project settings
        run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN" --scope=killjoy00s-projects

      - name: Ensure production custom domain
        run: |
          if ! npx --yes vercel@${VERCEL_CLI_VERSION} domains inspect soccertime.planitnow.us --project soccer-time --token="$VERCEL_TOKEN" --scope=killjoy00s-projects >/dev/null 2>&1; then
            npx --yes vercel@${VERCEL_CLI_VERSION} domains add soccertime.planitnow.us soccer-time --token="$VERCEL_TOKEN" --scope=killjoy00s-projects
          fi

      - name: Build production artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN" --scope=killjoy00s-projects

      - name: Deploy prebuilt artifact
        run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope=killjoy00s-projects

      - name: Progress completed Gameweeks
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Production Gameweek progression attempt ${attempt}/6"
            if response="$(curl --fail-with-body --silent --show-error -X POST https://soccertime.planitnow.us/api/progress 2>&1)"; then
              echo "$response"
              if printf '%s' "$response" | node -e 'let s=""; process.stdin.on("data", d => s += d).on("end", () => { try { process.exit(JSON.parse(s).ok === true ? 0 : 1); } catch { process.exit(1); } });'; then
                exit 0
              fi
            else
              echo "$response"
            fi
            sleep 5
          done
          echo "::error::Production Gameweek progression failed after deployment."
          exit 1

      - name: Verify production health
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Production health check attempt ${attempt}/6"
            if response="$(curl --fail-with-body --silent --show-error https://soccertime.planitnow.us/api/health/e2e 2>&1)"; then
              echo "$response"
              exit 0
            fi
            echo "$response"
            sleep 5
          done
          echo "::error::Production health check failed after deployment."
          exit 1
